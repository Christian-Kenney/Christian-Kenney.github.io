<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Revenue Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      margin: 0;
      color: #fff;
      font-weight: black;
    }

    .calculator {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 500px;
      text-align: center;
      font-weight: black;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: black;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      background: linear-gradient(90deg, #ff758c, #ff7eb9);
      color: #fff;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      transform: scale(1.02);
      box-shadow: 0 6px 10px rgba(0,0,0,0.4);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      color: #6a11cb;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }

    #result {
      margin-top: 25px;
    }

    .line {
      padding: 14px;
      border-radius: 15px;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
      color: #fff;
    }

    .positive {
      background: linear-gradient(90deg, #19692c, #396339);
    }

    .negative {
      background: linear-gradient(90deg, #dc3545, #ff6f61);
    }

    .desc {
      font-size: 14px;
      margin-bottom: 8px;
      color: #fff;
      opacity: 0.9;
    }

    select option {
      background: #6a11cb;
      color: #fff;
    }

    #sheetData {
      margin-top: 30px;
      overflow-x: auto;
    }

    #dataTable {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    #dataTable th, #dataTable td {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.3);
    }

    #dataTable th {
      font-weight: bold;
    }

    #dataTable .positive {
      background: linear-gradient(90deg, #19692c, #396339);
    }

    #dataTable .negative {
      background: linear-gradient(90deg, #dc3545, #ff6f61);
    }

    @media (max-width: 500px) {
      .calculator {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      input, select, button {
        font-size: 14px;
        padding: 10px;
      }

      .line {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>Revenue Calculator</h1>

    <label for="costPrice">Price Paid ($):</label>
    <input type="number" id="costPrice" step="0.01">

    <label for="sellPrice">Price Sold ($):</label>
    <input type="number" id="sellPrice" step="0.01">

    <label for="shippingSize">Shipping Size:</label>
    <select id="shippingSize">
      <option value="5">Small ($5)</option>
      <option value="10">Medium ($10)</option>
      <option value="15">Large ($15)</option>
    </select>

    <button onclick="calculateRevenue()">Calculate</button>

    <div id="result"></div>

    <div id="sheetData">
      <table id="dataTable">
        <thead>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://apis.google.com/js/client.js"></script>
  <script>
    const SPREADSHEET_ID = "1Y8otZsOYRt3esZUGwIhEPmhy_-OtQukLJlrT2SleDi0";
    const SHEET_NAME = "Sheet1";
    const API_KEY = "AIzaSyARKfcIFXIqzospYH_ZKFd3WoezPq7d0BM";

    const columnsToShow = [0,1,2,4,5,6,7,8,9,13]; // A,B,C,E,F,G,H,I,J,N

    function initClient() {
      gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: ["https://sheets.googleapis.com/$discovery/rest?version=v4"]
      }).then(() => {
        console.log("Google Sheets API loaded.");
      });
    }

    gapi.load("client", initClient);

    function readFromSheet() {
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(SHEET_NAME)}?key=${API_KEY}`;
      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.values) {
            const tbody = document.querySelector("#dataTable tbody");
            tbody.innerHTML = "";

            data.values.forEach((row,index) => {
              if(index === 0) return; // skip header if needed
              const tr = document.createElement("tr");
              columnsToShow.forEach((colIndex,i)=>{
                const td = document.createElement("td");
                td.textContent = row[colIndex] || "";
                // Color the last column (Revenue/N) positive/negative
                if(i === columnsToShow.length -1) {
                  const val = parseFloat(row[colIndex]);
                  td.className = val >= 0 ? 'positive' : 'negative';
                }
                tr.appendChild(td);
              });
              tbody.appendChild(tr);
            });
          }
        })
        .catch(error => console.error("❌ Error reading from Google Sheets:", error));
    }

    document.addEventListener("DOMContentLoaded", readFromSheet);

    function calculateRevenue() {
      const costPrice = parseFloat(document.getElementById('costPrice').value) || 0;
      const sellPriceInput = document.getElementById('sellPrice').value;
      const shippingCost = parseFloat(document.getElementById('shippingSize').value);
      const resultDiv = document.getElementById('result');

      function formatValue(value, description) {
        const cls = value >= 0 ? 'positive' : 'negative';
        return `<div class="line ${cls}">${value.toFixed(2)}<div class="desc">${description}</div></div>`;
      }

      if (sellPriceInput) {
        const sellPrice = parseFloat(sellPriceInput);

        let ebayFee = sellPrice * 0.135;
        let tcgFee = sellPrice * 0.125;
        if(tcgFee > 50) tcgFee = 50;

        const localRevenue = sellPrice - costPrice;
        const ebayRevenue = sellPrice - costPrice - shippingCost - ebayFee;
        const tcgRevenue = sellPrice - costPrice - shippingCost - tcgFee;

        resultDiv.innerHTML = `
          ${formatValue(localRevenue, 'Local Revenue')}
          ${formatValue(ebayRevenue, 'eBay Revenue')}
          ${formatValue(tcgRevenue, 'TCGPlayer Revenue')}
        `;

        // Optionally: Add a new row to table (last column = eBayRevenue)
        const tbody = document.querySelector("#dataTable tbody");
        const tr = document.createElement("tr");
        columnsToShow.forEach((colIndex,i)=>{
          const td = document.createElement("td");
          // For demo, fill only some columns, rest empty
          if(i===0) td.textContent = costPrice;
          else if(i===1) td.textContent = sellPrice;
          else if(i===2) td.textContent = shippingCost;
          else if(i===columnsToShow.length-1) td.textContent = ebayRevenue.toFixed(2);
          else td.textContent = "";
          if(i===columnsToShow.length-1) td.className = ebayRevenue>=0?'positive':'negative';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);

      } else {
        const baseCost = costPrice + shippingCost;
        const localMin = costPrice;
        const ebayMin = baseCost / (1 - 0.135);
        const tcgMin = baseCost / (1 - 0.12);

        resultDiv.innerHTML = `
          ${formatValue(localMin, 'Minimum Sell Price (Local break-even)')}
          ${formatValue(ebayMin, 'Minimum Sell Price (eBay break-even)')}
          ${formatValue(tcgMin, 'Minimum Sell Price (TCGPlayer break-even)')}
        `;
      }
    }
  </script>
</body>
</html>
